AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - tmp/**/*
    - vendor/**/*
    # Emitted by tools/; regenerate these, do not reformat them.
    - lib/ruby_pptx/autoshape_spec.rb
    - lib/ruby_pptx/opc/constants.rb
    - lib/ruby_pptx/enum/**/*

# --------------------------------------------------------------------------
# The oxml layer mirrors OOXML
#
# `Pptx::Oxml::CT_Shape`, `#cSld`, `#sldLayoutIdLst`, `bgPr` -- these are the
# names in the ECMA-376 schema, and keeping them verbatim is what makes the
# XML, the specification and this code readable side by side. It is also what
# lets an upstream python-pptx commit be read as a patch against this port.
# Renaming them to snake_case would be more conventional Ruby and a great deal
# less useful.
# --------------------------------------------------------------------------
Naming/ClassAndModuleCamelCase:
  Exclude:
    - lib/ruby_pptx/oxml/**/*
    - lib/ruby_pptx/enum/**/*
    - lib/ruby_pptx/opc/oxml.rb
    # CONTENT_TYPE and RELATIONSHIP_TYPE are namespaces of constants, named
    # for the constants they hold, exactly as python-pptx names them.
    - lib/ruby_pptx/opc/constants.rb
    # Specs define throwaway CT_* elements to exercise the content-model DSL.
    - spec/**/*

Naming/MethodName:
  Exclude:
    - lib/ruby_pptx/oxml/**/*
    - lib/ruby_pptx/opc/oxml.rb
    - lib/ruby_pptx/chart/xml_writer.rb

Naming/VariableName:
  Exclude:
    - lib/ruby_pptx/oxml/**/*

# `get_or_add_x` is the name python-pptx gives these throughout, and the API
# layer reaches for the same word when it does the same thing.
Naming/AccessorMethodName:
  Exclude:
    - lib/ruby_pptx/oxml/**/*
    - lib/ruby_pptx/action.rb

# `convert_from_xml` returning a boolean is the simple-type protocol every
# type implements, not a predicate that forgot its question mark.
Naming/PredicateMethod:
  Exclude:
    - lib/ruby_pptx/oxml/**/*
    - spec/**/*

# `accent1`, `lvl1pPr`, `dk2` and `tx1` are schema names, not numbered
# variables, and every one of them would have to be exempted individually.
Naming/VariableNumber:
  Enabled: false

# `cx`, `cy`, `x`, `y`, `sz`, `r_id` are the OOXML attribute names.
Naming/MethodParameterName:
  MinNameLength: 1

# `length * 2` scales by a factor; naming the argument `other` would suggest
# multiplying two lengths, which is exactly what Length refuses to do.
Naming/BinaryOperatorParameterName:
  Exclude:
    - lib/ruby_pptx/length.rb
    - lib/ruby_pptx/geometry.rb

# --------------------------------------------------------------------------
# House style
# --------------------------------------------------------------------------
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# EMU values run to eight digits and are far easier to check with separators.
Style/NumericLiterals:
  MinDigits: 6

Layout/LineLength:
  Max: 110

# A class whose name and single public method say what it is does not need a
# comment repeating them; the ones that need explaining have it.
Style/Documentation:
  Enabled: false

# --------------------------------------------------------------------------
# Metrics
#
# The content-model DSL and the chart XML writers are declarative: a long
# method there is a long list, not tangled logic. Splitting them to satisfy a
# line count would make them harder to check against the schema.
# --------------------------------------------------------------------------
Metrics/ClassLength:
  Max: 250
  Exclude:
    - lib/ruby_pptx/oxml/**/*
    - lib/ruby_pptx/chart/**/*

Metrics/ModuleLength:
  Max: 250
  Exclude:
    - lib/ruby_pptx/oxml/**/*
    - lib/ruby_pptx/enum/**/*
    - spec/**/*

Metrics/MethodLength:
  Max: 20
  Exclude:
    - spec/**/*
    - lib/ruby_pptx/oxml/**/*
    - lib/ruby_pptx/image.rb
    - lib/ruby_pptx/chart/xml_writer.rb
    - lib/ruby_pptx/chart/combo.rb

# A spec that builds a fixture deck is a linear script; its branch count says
# nothing about how hard it is to read.
Metrics/AbcSize:
  Max: 30
  Exclude:
    - spec/**/*
    - lib/ruby_pptx/oxml/**/*
    - lib/ruby_pptx/chart/xml_writer.rb
    - lib/ruby_pptx/image.rb

# Keyword arguments name themselves at the call site, so a long keyword list
# is a menu of options rather than a row of unlabelled positions.
Metrics/ParameterLists:
  Max: 6
  CountKeywordArgs: false
  Exclude:
    - lib/ruby_pptx/oxml/**/*

# A binary-format parser is a flat sequence of cases dictated by the format.
# Splitting one to reduce a branch count hides the structure it is following.
Metrics/CyclomaticComplexity:
  Max: 10
  Exclude:
    - lib/ruby_pptx/image.rb

Metrics/PerceivedComplexity:
  Max: 10
  Exclude:
    - lib/ruby_pptx/image.rb

Metrics/BlockLength:
  Exclude:
    - spec/**/*
    - lib/ruby_pptx/oxml/**/*
    - lib/ruby_pptx/enum/**/*

# Generated enum files define their members inside a block.
Lint/ConstantDefinitionInBlock:
  Exclude:
    - spec/**/*
    - lib/ruby_pptx/enum/**/*

Style/WordArray:
  MinSize: 3

# `format("%02X%02X%02X", r, g, b)` is clearer than naming each of three
# identical hex fields.
Style/FormatStringToken:
  EnforcedStyle: unannotated

# --------------------------------------------------------------------------
# No endless methods in lib
#
# RDoc 7 and earlier -- the versions Ruby 3.3 to 4.0 ship, and which
# `gem install` runs to build ri docs -- cannot parse `def x = ...`. Each one
# swallows its class's `end`, every later class nests inside the one before,
# and on Windows the resulting paths grow too long and the install fails.
# RDoc 8 is fixed, but users get whatever their Ruby bundles.
# --------------------------------------------------------------------------
Style/EndlessMethod:
  EnforcedStyle: disallow
  Include:
    - lib/**/*
