name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  spec:
    name: "specs (ruby ${{ matrix.ruby }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # The fit_text specs measure real glyph outlines, so they need real font
      # files. Both sides of that comparison read the same ones; without them
      # the specs skip rather than fail, which would hide them silently.
      - name: Install the fonts the text-fitting specs measure
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-urw-base35

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spec/oracle-requirements.txt

      # Versions are pinned in the requirements file, which explains why.
      - name: Install the python-pptx oracle
        run: pip install -r spec/oracle-requirements.txt

      - name: Verify the oracle is the pinned version
        run: |
          python -c "import pptx; assert pptx.__version__ == '1.0.2', pptx.__version__"
          python -c "import openpyxl, PIL, lxml"

      # REQUIRE_ORACLE turns "python-pptx is missing" from a skip into a
      # failure. Without it a broken Python setup would quietly drop the 47
      # differential specs and still report green.
      # One version is enough; style does not vary by Ruby.
      - name: Check style
        if: matrix.ruby == '3.3'
        run: bundle exec rubocop --format github

      - name: Run the specs
        env:
          REQUIRE_ORACLE: "1"
        run: bundle exec rspec --format progress
