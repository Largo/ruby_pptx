name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  spec:
    name: "specs (ruby ${{ matrix.ruby }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The suite checks this gem against python-pptx by diffing the packages
      # both produce. That comparison is only meaningful against a known
      # version: a new python-pptx release could legitimately change its output
      # and turn the whole suite red for no fault of ours. Pin it, and bump
      # deliberately. openpyxl reads the embedded chart workbook, which is the
      # one part that cannot be compared byte-for-byte.
      - name: Install the python-pptx oracle
        run: pip install "python-pptx==1.0.2" "openpyxl~=3.1"

      - name: Verify the oracle is the pinned version
        run: |
          python -c "import pptx; assert pptx.__version__ == '1.0.2', pptx.__version__"
          python -c "import openpyxl, PIL, lxml"

      # REQUIRE_ORACLE turns "python-pptx is missing" from a skip into a
      # failure. Without it a broken Python setup would quietly drop the 47
      # differential specs and still report green.
      - name: Run the specs
        env:
          REQUIRE_ORACLE: "1"
        run: bundle exec rspec --format progress
