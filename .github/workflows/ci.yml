name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # So the release workflow can run the full suite before it builds.
  workflow_call:

jobs:
  spec:
    name: "specs (ruby ${{ matrix.ruby }}, ${{ matrix.xml }})"
    runs-on: ubuntu-latest

    # Every spec runs under both XML backends: Nokogiri, and the pure-Ruby
    # REXML fallback that ruby.wasm uses. The output must be the same.
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        xml: [nokogiri, rexml]

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # The fit_text specs measure real glyph outlines, so they need real font
      # files. Both sides of that comparison read the same ones; without them
      # the specs skip rather than fail, which would hide them silently.
      - name: Install the fonts the text-fitting specs measure
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-urw-base35

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spec/oracle-requirements.txt

      # Versions are pinned in the requirements file, which explains why.
      - name: Install the python-pptx oracle
        run: pip install -r spec/oracle-requirements.txt

      - name: Verify the oracle is the pinned version
        run: |
          python -c "import pptx; assert pptx.__version__ == '1.0.2', pptx.__version__"
          python -c "import openpyxl, PIL, lxml"

      # One version is enough; style does not vary by Ruby.
      - name: Check style
        if: matrix.ruby == '3.3' && matrix.xml == 'nokogiri'
        run: bundle exec rubocop --format github

      # `gem install` builds ri docs with the RDoc that Ruby bundles, and an
      # RDoc that misparses the source files one class inside another; on
      # Windows the install then fails on the too-long path. Build the docs
      # as gem install would and check each class sits where it really is.
      - name: Check RDoc reads the library correctly
        if: matrix.xml == 'nokogiri'
        run: |
          rdoc --version
          rdoc --quiet --ri --output "$RUNNER_TEMP/ri" lib > /dev/null
          bundle exec ruby -Ilib -rruby_pptx -rruby_pptx/refinements -e '
            dir = ARGV[0]
            paths = Dir.glob("**/cdesc-*.ri", base: dir)
            wrong = paths.map { |p| File.dirname(p).split("/").join("::") }
                         .reject { |name| Object.const_defined?(name) }
            abort "RDoc misplaced #{wrong.size} classes, e.g. #{wrong.first(3).join(", ")}" if wrong.any?
            puts "#{paths.size} classes documented where they are defined"
          ' "$RUNNER_TEMP/ri"

      # REQUIRE_ORACLE turns "python-pptx is missing" from a skip into a
      # failure. Without it a broken Python setup would quietly drop the
      # differential specs and still report green. spec_helper likewise
      # aborts if the library loaded a different backend than was asked for.
      - name: Run the specs
        env:
          REQUIRE_ORACLE: "1"
          RUBY_PPTX_XML_BACKEND: ${{ matrix.xml }}
        run: bundle exec rspec --format progress

  # The gem under ruby.wasm, loaded as a web page would load it: no Nokogiri,
  # files in an in-memory filesystem. Catches anything that assumes a native
  # extension -- a stray `require "nokogiri"` passed every other check.
  wasm:
    name: "ruby.wasm (ruby 4.0)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/wasm/package-lock.json

      - name: Install ruby.wasm
        working-directory: tools/wasm
        run: npm ci --no-audit --no-fund

      - name: Build, save and reread a deck in ruby.wasm
        run: |
          gems=$(bundle exec ruby -e 'print %w[rubyzip rexml].map { |g| "#{g}=#{Gem.loaded_specs[g].full_gem_path}/lib" }.join(" ")')
          node tools/wasm/run.mjs tools/wasm/smoke.rb "$RUNNER_TEMP/wasm" ruby_pptx=lib $gems

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check python-pptx reads what ruby.wasm wrote
        run: |
          pip install python-pptx==1.0.2
          python -c "
          import sys, pptx
          p = pptx.Presentation(sys.argv[1])
          assert p.slides[0].shapes.title.text == 'Built in ruby.wasm'
          assert p.slides[1].shapes[0].chart.chart_title.text_frame.text == 'Sales'
          print('python-pptx reads it:', len(p.slides), 'slides')
          " "$RUNNER_TEMP/wasm/out.pptx"
